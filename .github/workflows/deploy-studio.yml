# studio 的两件事，一个文件管：
#   - 改了 studio（推分支或提 PR）→ 只跑质量门禁（format + analyze + test），不部署
#   - 推 studio/* tag（由 qtcloud-devops release publish 创建）→ 门禁过了再构建 Web 版，
#     上传到 OSS 桶 qtdata-studio（静态网站托管），并刷新 CDN 缓存
#
# 对齐家族里 qtcloud-work 的 release-studio.yml：用 `if` 把部署限在 tag 上，分支推送只跑到门禁为止。
#
# 门禁三条与平台契约一致：Dart = dart format + flutter analyze（本地从严、与 CI 一致），外加 flutter test。
#
# 所需 GitHub secrets（repo 级）：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET：RAM 用户 AccessKey（OSS 上传 + CDN 刷新）

name: deploy-studio

on:
  push:
    branches:
      - '**'
    tags:
      - 'studio/*'
    paths:
      - 'src/studio/**'
      - '.github/workflows/deploy-studio.yml'
  pull_request:
    paths:
      - 'src/studio/**'
      - '.github/workflows/deploy-studio.yml'

# 按 ref 分组：分支上的门禁不会把正在跑的发布干掉
concurrency:
  group: deploy-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-and-deploy:
    name: Build Flutter Web & Deploy to OSS
    needs: quality-gates
    if: startsWith(github.ref, 'refs/tags/studio/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - run: cd src/studio && flutter pub get
      # --no-web-resources-cdn：CanvasKit 用仓内本地 canvaskit/，不从 www.gstatic.com 拉（国外 CDN 打不开的机器开屏白屏）
      - run: cd src/studio && flutter build web --no-web-resources-cdn

      - uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: oss-cn-hangzhou.aliyuncs.com
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - run: ossutil cp src/studio/build/web/ oss://qtdata-studio/ -r -f --meta=Cache-Control:public,max-age=31536000

      # 元信息与入口文件单独 no-cache：内容随版本变更，长缓存会导致浏览器拿不到新版
      - run: ossutil cp src/studio/build/web/manifest.json oss://qtdata-studio/manifest.json -f --meta=Cache-Control:no-cache
      - run: ossutil cp src/studio/build/web/index.html oss://qtdata-studio/index.html -f --meta=Cache-Control:no-cache
      - run: ossutil cp src/studio/build/web/flutter_bootstrap.js oss://qtdata-studio/flutter_bootstrap.js -f --meta=Cache-Control:no-cache

      # 字体子集随文案增字会变，单独 no-cache（文件小，304 重验成本可忽略）
      - run: ossutil cp src/studio/build/web/assets/fonts/ oss://qtdata-studio/assets/fonts/ -r -f --meta=Cache-Control:no-cache

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          import os
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          # studio.data.quanttide.com 是正式入口；data.quanttide.com 仍指向同一个桶，
          # 一并刷新，免得它一直吐旧版（等它改指 site 桶或下线时再摘掉）
          for domain in ['studio.data.quanttide.com', 'data.quanttide.com']:
              req = RefreshObjectCachesRequest()
              req.set_ObjectPath(f'https://{domain}/')
              req.set_ObjectType('Directory')
              cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
