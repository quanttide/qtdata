<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>量潮数据 · 我的项目</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div id="toast" class="toast"></div>

    <div id="app" class="flex min-h-screen">

        <aside class="w-20 bg-white border-r border-gray-100 flex flex-col items-center py-4 gap-0.5 flex-shrink-0 h-screen sticky top-0 z-10">
            <a href="index.html" class="text-xl font-bold text-indigo-600 mb-3">量</a>
            <a href="index.html" class="sidebar-icon active" title="我的项目">
                <i class="fas fa-th-large text-lg"></i>
            </a>
            <div class="mt-auto sidebar-icon" title="帮助">
                <i class="fas fa-question-circle text-lg"></i>
            </div>
        </aside>

        <main class="flex-1 p-5 md:p-7 max-w-6xl overflow-y-auto h-screen">

            <!-- ====== 首页 ====== -->
            <div id="page-dashboard">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">我的项目</h1>
                        <p class="text-sm text-gray-400 mt-0.5">当前所有数据项目的进度总览</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                    <div class="stat-card active-filter" onclick="filterProjects('all', this)">
                        <div class="number">1</div>
                        <div class="label">全部项目</div>
                    </div>
                    <div class="stat-card" onclick="filterProjects('active', this)">
                        <div class="number num-amber">1</div>
                        <div class="label">进行中</div>
                    </div>
                    <div class="stat-card" onclick="filterProjects('done', this)">
                        <div class="number num-green">0</div>
                        <div class="label">已完成</div>
                    </div>
                    <div class="stat-card" onclick="filterProjects('pending', this)">
                        <div class="number num-gray">0</div>
                        <div class="label">待启动</div>
                    </div>
                </div>

                <div class="flex items-center justify-between mb-3">
                    <div class="filter-group">
                        <button class="active" onclick="filterProjects('all', null, this)">全部</button>
                        <button onclick="filterProjects('active', null, this)">进行中</button>
                        <button onclick="filterProjects('done', null, this)">已完成</button>
                        <button onclick="filterProjects('pending', null, this)">待启动</button>
                    </div>
                    <span class="text-xs text-gray-400" id="projectCount">1 个项目</span>
                </div>

                <div class="space-y-3" id="projectList"></div>

                <div class="text-xs text-gray-300 mt-4 text-center">点击项目查看全流程进度与时间线</div>
            </div>

        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
