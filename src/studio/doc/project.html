<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>量潮数据 · 项目详情</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div id="toast" class="toast"></div>

    <div id="docModal" class="modal-overlay">
        <div class="modal-box">
            <div class="flex items-center justify-between mb-3">
                <div>
                    <h2 class="text-lg font-bold text-gray-800" id="docModalTitle">资料详情</h2>
                    <p class="text-xs text-gray-400" id="docModalSub">交付物</p>
                </div>
                <button class="text-gray-400 hover:text-gray-600 text-xl" onclick="closeDocModal()">&times;</button>
            </div>
            <div id="docModalContent"></div>
        </div>
    </div>

    <div id="app" class="flex min-h-screen">

        <aside class="w-20 bg-white border-r border-gray-100 flex flex-col items-center py-4 gap-0.5 flex-shrink-0 h-screen sticky top-0 z-10">
            <a href="index.html" class="text-xl font-bold text-indigo-600 mb-3">量</a>
            <a href="index.html" class="sidebar-icon active" title="我的项目">
                <i class="fas fa-th-large text-lg"></i>
            </a>
            <div class="mt-auto sidebar-icon" title="帮助">
                <i class="fas fa-question-circle text-lg"></i>
            </div>
        </aside>

        <main class="flex-1 p-5 md:p-7 max-w-6xl overflow-y-auto h-screen">

            <!-- ====== 项目详情页 ====== -->
            <div id="page-timeline">
                <div class="flex items-center gap-3 mb-4">
                    <a href="index.html" class="text-gray-400 hover:text-gray-600"><i class="fas fa-arrow-left"></i></a>
                    <div class="flex-1">
                        <div class="flex items-center gap-3 flex-wrap">
                            <h1 class="text-xl font-bold text-gray-800" id="tlTitle">项目名称</h1>
                            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full" id="tlStatus">进行中</span>
                            <span class="phase-tag" id="tlPhase">实施</span>
                        </div>
                        <p class="text-sm text-gray-400 mt-0.5" id="tlClient">创建于 —</p>
                    </div>
                    <button class="btn-primary text-sm" onclick="showToast('📄 报告已导出')"><i class="fas fa-file-pdf"></i> 导出</button>
                </div>

                <!-- ===== 全流程进度总览（二维网格） ===== -->
                <div class="bg-white rounded-2xl border border-gray-100 p-5 mb-4 overflow-x-auto">
                    <div class="flex items-center gap-2 mb-3">
                        <i class="fas fa-table text-indigo-500"></i>
                        <span class="font-semibold text-gray-700">全流程进度总览</span>
                    </div>
                    <div id="tlPhaseMatrix"></div>
                </div>

                <!-- 完整数据蓝图 -->
                <div class="bg-white rounded-2xl border border-gray-100 p-5 mb-4">
                    <div class="flex items-center gap-2 mb-3">
                        <i class="fas fa-code-branch text-indigo-500"></i>
                        <span class="font-semibold text-gray-700">完整数据蓝图</span>
                        <span class="text-xs text-gray-400">| 处理流程 + 异常预案</span>
                    </div>
                    <div class="mb-3">
                        <div class="text-xs font-semibold text-blue-500 uppercase tracking-wider mb-2">处理流程</div>
                        <div id="tlBlueprintSteps" class="blueprint-section"></div>
                    </div>
                    <div>
                        <div class="text-xs font-semibold text-amber-500 uppercase tracking-wider mb-2">异常处理预案</div>
                        <div id="tlBlueprintExceptions" class="blueprint-section"></div>
                    </div>
                </div>

                <!-- 交付时间线 -->
                <div class="bg-white rounded-2xl border border-gray-100 p-5">
                    <div class="flex items-center gap-2 mb-3">
                        <i class="fas fa-clock text-indigo-400"></i>
                        <span class="font-semibold text-gray-700">交付时间线</span>
                        <span class="text-xs text-gray-400">| 每个阶段的交付物</span>
                    </div>
                    <div class="timeline" id="tlTimeline"></div>
                </div>

                <div class="text-center text-xs text-gray-300 mt-4">点击「查看资料」获取交付物文件</div>
            </div>

        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/project.js"></script>

</body>
</html>
