[project]
name = "qtdata-provider"
version = "0.1.0"
description = "QTData provider service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "fastapi-quanttide-project>=0.1.1",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
qtdata-provider = "app.main:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
