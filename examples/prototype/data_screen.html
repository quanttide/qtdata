<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据流程</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 flex items-start justify-center min-h-screen">
    <div class="flex items-center gap-2">
        <div class="bg-white rounded-xl border border-green-300 shadow-sm px-4 py-3 text-center min-w-[130px]">
            <div class="text-sm font-semibold">导入销售订单</div>
            <div class="text-xs text-green-600 mt-1">已完成</div>
        </div>

        <svg class="w-5 h-5 text-gray-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>

        <div class="bg-white rounded-xl border border-green-300 shadow-sm px-4 py-3 text-center min-w-[130px]">
            <div class="text-sm font-semibold">清洗订单数据</div>
            <div class="text-xs text-green-600 mt-1">已完成</div>
        </div>

        <svg class="w-5 h-5 text-gray-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>

        <div class="bg-white rounded-xl border border-green-300 shadow-sm px-4 py-3 text-center min-w-[130px]">
            <div class="text-sm font-semibold">合并客户信息</div>
            <div class="text-xs text-green-600 mt-1">已完成</div>
        </div>

        <svg class="w-5 h-5 text-gray-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>

        <div class="bg-white rounded-xl border border-blue-300 shadow-sm px-4 py-3 text-center min-w-[130px]">
            <div class="text-sm font-semibold">计算客户RFM</div>
            <div class="text-xs text-blue-600 mt-1">进行中</div>
        </div>

        <svg class="w-5 h-5 text-gray-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>

        <div class="bg-white rounded-xl border border-gray-200 shadow-sm px-4 py-3 text-center min-w-[130px]">
            <div class="text-sm font-semibold">生成分析报告</div>
            <div class="text-xs text-gray-400 mt-1">待处理</div>
        </div>
    </div>
</body>
</html>
