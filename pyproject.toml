[project]
name = "qtdata-e2e"
version = "0.1.0"
description = "QTData end-to-end tests"
requires-python = ">=3.12"

dependencies = [
    "qtdata-provider",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "mss>=9.0.0",
    "pytesseract>=0.3.10",
    "pytest-cov>=7.1.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
qtdata-provider = { path = "src/provider" }
